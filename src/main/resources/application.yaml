spring:
  application:
    name: uatch-backend

  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:uatch}
    username: ${POSTGRES_USER:uatch}
    password: ${POSTGRES_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  sql:
    init:
      mode: never