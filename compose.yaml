services:
  postgres:
    image: docker.io/library/postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Preencha POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?Preencha POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Preencha POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data: